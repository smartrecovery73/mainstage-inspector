name: Suggest an improvement
description: Suggest a feature or improvement for MainStage Inspector.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion! Please search existing proposals first. You may write in English or Italian.
        Describe your practical need without including concerts or personal information.
  - type: textarea
    id: need
    attributes:
      label: What need would this address?
      placeholder: "When preparing a concert, I would like to…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior with a concrete example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: Briefly describe any workaround you currently use.
  - type: textarea
    id: context
    attributes:
      label: Context and examples
      description: If useful, include your app version and screenshots or diagrams without private information.
