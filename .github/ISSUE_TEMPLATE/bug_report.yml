name: Report a bug
description: Report an error or unexpected result in MainStage Inspector.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping! Please search existing issues first. You may write in English or Italian.
        Do not attach complete concerts or reports containing personal data. Remove private paths, names and other sensitive information from screenshots and error messages.
  - type: input
    id: app_version
    attributes:
      label: MainStage Inspector version
      placeholder: "Example: 1.0.0 (build 13)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac chip
      description: Find these details in Apple menu > About This Mac.
      placeholder: "Example: macOS 15.7, Apple M1"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: How did you install the app?
      options:
        - Official .pkg installer
        - Built from source
        - Other or unsure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area is affected?
      options:
        - Installation or startup
        - Opening or analyzing a concert
        - Sets, Patches or channel strips
        - Plugin names or presets
        - MIDI inputs or keyboard zones
        - Search or summary
        - Report export
        - Interface or accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error message, with personal information removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: concert_context
    attributes:
      label: Concert and plugin context
      description: If relevant, include MainStage version, plugin manufacturer and version, whether the plugin is installed, and whether the concert was saved after changes. You do not need to provide your concert name.
      placeholder: "Example: an effect preset is not recognized; manufacturer…, plugin…, version…"
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots and additional details
      description: Attach images without private information if useful. Say whether this affects all concerts or only some. Attaching the .concert file is not required.
